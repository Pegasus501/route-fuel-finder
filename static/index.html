<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f8a4c">
<title>StationRat</title>
<meta name="description" content="Le système de recherche de station essence pour les gros rats">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐀%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--ink:#1c2321;--muted:#66706c;--line:#e2e5e2;--accent:#1f8a4c;--accent-ink:#fff;--warn:#b45309;--bad:#b91c1c;--chip:#eef3ef;--blue:#2563eb}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--panel:#1b201e;--ink:#e8ece9;--muted:#9aa49f;--line:#2c3330;--accent:#3fbf75;--accent-ink:#0b1a12;--warn:#f59e0b;--bad:#f87171;--chip:#24302a;--blue:#60a5fa}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:14px 16px 4px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#langBtn{flex:0 0 auto;padding:7px 12px;font-weight:700;font-size:13px}
h1{margin:0;font-size:20px}
h1 span{color:var(--accent)}
.tagline{font-size:13px;font-weight:600;color:var(--ink);opacity:.8}
.sub{color:var(--muted);font-size:13px}
/* portrait / narrow: one column, map under the search form, floating mini-map when scrolled past */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:12px 16px 16px}
.side{display:contents}
#formCard{order:1}
#mapSlot{order:2;height:50vh;min-height:260px;position:relative}
.side>.card:not(#formCard){order:3}
/* landscape: map fixed on the right, only the left panel scrolls */
@media (orientation:landscape) and (min-width:640px){
  body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}
  .layout{flex:1;min-height:0;grid-template-columns:minmax(300px,420px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);gap:12px}
  .side{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:4px}
  #mapSlot{height:auto;min-height:0}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.field{position:relative;margin-bottom:8px}
.inrow{display:flex;gap:6px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;min-width:0}
.sugg{position:absolute;z-index:1000;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-top:2px;box-shadow:0 6px 18px #0003;display:none}
.sugg div{padding:9px 10px;cursor:pointer}
.sugg div:hover,.sugg div.on{background:var(--chip)}
.row{display:flex;gap:8px;align-items:end}
.row>*{flex:1}
button{font:inherit;border:0;border-radius:8px;padding:11px 14px;cursor:pointer}
.go{background:var(--accent);color:var(--accent-ink);font-weight:600;width:100%}
.go:disabled{opacity:.6}
.ghost{background:var(--chip);color:var(--ink);flex:0 0 auto;padding:10px 12px}
.fuels{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fuels button{padding:7px 12px;background:var(--chip);color:var(--ink);font-size:14px;font-weight:600}
.fuels button.on{background:var(--accent);color:var(--accent-ink)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:10px;padding:3px;margin-bottom:10px}
.tabs button{padding:8px;background:transparent;color:var(--ink);font-weight:600;border-radius:8px}
.tabs button.on{background:var(--panel);box-shadow:0 1px 3px #0002}
.seg{display:flex;background:var(--chip);border-radius:8px;padding:2px}
.seg button{flex:1;padding:8px 6px;background:transparent;color:var(--ink);font-size:13px;border-radius:6px;white-space:nowrap}
.seg button.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.picks{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:10px}
.pick{min-width:0;border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;background:var(--bg)}
.pick:hover{border-color:var(--accent)}
.pick .k{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pick .v{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.pick .w{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list{padding:0;display:flex;flex-direction:column;flex:none}
.st{padding:11px 12px;border-bottom:1px solid var(--line);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.st:hover{background:var(--chip)}
.st.sel{background:var(--chip);box-shadow:inset 3px 0 var(--accent)}
.st.na{opacity:.55}
.st.na .price{text-decoration:line-through}
.price{font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.price.best{color:var(--accent)}
.dt{font-size:13px;font-weight:700;text-align:right;white-space:nowrap}
.dt.zero{color:var(--accent)}
.ideal h3{margin:0;font-size:15px}
.ideal .hd{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.ideal .hd .meta input{width:52px;padding:4px 6px;font-size:13px;text-align:right}
.opt{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 10px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;background:var(--bg)}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:#f59e0b;box-shadow:0 0 0 1px #f59e0b}
.opt .l{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.opt .n{font-weight:600}
.opt .r{text-align:right;max-width:60%}
.opt{grid-template-columns:minmax(0,1fr)}
.opt .r{text-align:left;max-width:none;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 10px;margin-top:4px}
.opt .big{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.opt .save{color:var(--accent);font-weight:700}
.alts{margin:2px 0 6px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.alts .a{cursor:pointer;padding:3px 6px;border-radius:6px}
.alts .a:hover,.alts .a.on{background:var(--chip)}
.opt .loss{color:var(--bad);font-weight:700}
.tag.toll{background:#f59e0b;color:#1c1917;white-space:normal;display:inline-block}
.traffic{margin-top:6px;padding:6px 8px;border-radius:8px;background:var(--chip);font-size:13px}
.traffic b.bad{color:var(--bad)}
.meta{color:var(--muted);font-size:12px}
.tags{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:3px}
.tag{font-size:11px;padding:2px 7px;border-radius:99px;background:var(--chip);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tag.old{color:var(--warn)}
.tag.bad{background:var(--bad);color:#fff}
.tag.ok{color:var(--accent);font-weight:600}
.tag.cheap{background:var(--accent);color:var(--accent-ink)}
.tag.near{background:var(--blue);color:#fff}
.nav a{font-size:12px;color:var(--accent);margin-left:8px;text-decoration:none;font-weight:600}
.sortbar{display:flex;gap:6px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap;position:sticky;top:0;background:var(--panel);z-index:1}
.sortbar button{padding:5px 10px;font-size:13px;background:var(--chip);color:var(--ink)}
.sortbar button.on{background:var(--accent);color:var(--accent-ink)}
.sortbar label{display:flex;gap:4px;align-items:center;margin:0 0 0 auto;font-size:12px}
.sortbar input{width:auto}
#mapBox{position:absolute;inset:0}
#map{width:100%;height:100%;border-radius:12px;border:1px solid var(--line)}
#mapBox.pip{position:fixed;inset:auto 10px 10px auto;width:min(48vw,280px);height:min(32vh,230px);z-index:1500;box-shadow:0 8px 28px #0007;border-radius:12px}
#mapBox.pip.hidden{display:none}
.pipbtn{position:absolute;z-index:1600;border:0;border-radius:99px;background:var(--panel);color:var(--ink);box-shadow:0 2px 8px #0005;font-weight:700;cursor:pointer}
#pipClose{top:-10px;left:-10px;width:30px;height:30px;padding:0;display:none}
#pipBig{top:-10px;left:26px;height:30px;padding:0 10px;font-size:12px;display:none}
#mapBox.pip #pipClose,#mapBox.pip #pipBig{display:block}
#pipShow{position:fixed;right:12px;bottom:12px;padding:10px 14px;display:none}
.err{color:var(--bad)}
.note{font-size:12px;color:var(--muted);margin-top:8px}
.pin{width:32px;height:32px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #fff;box-shadow:0 1px 4px #0006;display:grid;place-items:center}
.pin span{transform:rotate(45deg);color:#fff;font:700 9px system-ui}
.pin.old{background:#9ca3af}
.pin.na{background:#b91c1c;opacity:.7}
.pin.best{background:#f59e0b}
.pin.near{background:#2563eb}
.st{scroll-margin-top:110px}
body.haspip .layout{padding-bottom:calc(min(32vh,230px) + 24px)}
.pin.selp{outline:3px solid #f59e0b;outline-offset:1px;transform:rotate(-45deg) scale(1.2)}
.more{grid-column:1/-1;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px;cursor:default}
.more .acts{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px}
.seemap{background:var(--accent);color:var(--accent-ink);padding:8px 14px;font-weight:600;font-size:14px}

</style>
</head>
<body>
<header>
  <div><h1>⛽🐀 Station<span>Rat</span></h1>
  <div class="tagline" data-i18n="The fuel station finder for big rats">Le système de recherche de station essence pour les gros rats</div>

<div class="layout">

    <div class="card" id="formCard">

        <button data-f="E85">E85</button><button data-f="Gazole" data-i18n="Diesel">Diesel</button><button data-f="E10">SP95-E10</button><button data-f="SP95">SP95</button><button data-f="SP98">SP98</button><button data-f="SP95E10" title="Show whichever of SP95 or SP95-E10 is cheaper at each station" data-i18n-title="Show whichever of SP95 or SP95-E10 is cheaper at each station">SP95 + E10</button>
      </div>
      <div class="tabs" id="modeTabs"><button data-m="trip" class="on" data-i18n="🚗 Trip">🚗 Trip</button><button data-m="near" data-i18n="📍 Around a place">📍 Around a place</button></div>
      <div id="tripPanel">
      <div class="field"><label data-i18n="From">From</label>
        <div class="inrow"><input id="from" placeholder="e.g. Paris" data-i18n-ph="e.g. Paris" autocomplete="off"><button class="ghost" id="locate" title="Use my current location" data-i18n-title="Use my current location">📍</button></div>
        <div class="sugg"></div></div>
      <div class="field" id="viaWrap" style="display:none"><label data-i18n="Via (optional)">Via (optional)</label><input id="via" placeholder="Stop along the way" data-i18n-ph="Stop along the way" autocomplete="off"><div class="sugg"></div></div>
      <div class="field"><label data-i18n="To">To</label><input id="to" placeholder="e.g. Lyon" data-i18n-ph="e.g. Lyon" autocomplete="off"><div class="sugg"></div></div>
      <div class="row">
        <div><label data-i18n="Max distance from route">Max distance from route</label>
          <select id="corridor"><option value="1">1 km</option><option value="2">2 km</option><option value="3" selected>3 km</option><option value="5">5 km</option><option value="10">10 km</option><option value="20">20 km</option></select></div>
        <button class="ghost" id="swap" title="Swap start and end" data-i18n-title="Swap start and end">⇅</button>
        <button class="ghost" id="addVia" title="Add a stop" data-i18n-title="Add a stop" data-i18n="+ via">+ via</button>
      </div>
      </div>
      <div id="nearPanel" style="display:none">
        <div class="field"><label data-i18n="Around">Around</label>
          <div class="inrow"><input id="center" placeholder="Address or town, or tap 📍" data-i18n-ph="Address or town, or tap 📍" autocomplete="off"><button class="ghost" id="locate2" title="Use my current location" data-i18n-title="Use my current location">📍</button></div>
          <div class="sugg"></div></div>
        <div class="row">
          <div style="flex:0 0 96px"><label data-i18n="Radius">Radius</label>
            <select id="radius"><option value="2">2 km</option><option value="5">5 km</option><option value="10" selected>10 km</option><option value="20">20 km</option><option value="30">30 km</option><option value="50">50 km</option></select></div>
          <div><label data-i18n="Measured">Measured</label>
            <div class="seg" id="rmode"><button data-r="drive" class="on" data-i18n="By road">By road</button><button data-r="crow" data-i18n="Vol d'oiseau">Vol d'oiseau</button></div></div>
        </div>
      </div>
      <div style="margin-top:10px"><button class="go" id="go" data-i18n="Find stations">Find stations</button></div>
    </div>
    <div class="card" id="summary" style="display:none"></div>
    <div class="card ideal" id="idealCard" style="display:none">
      <div class="hd"><h3 data-i18n="✨ Ideal stops">✨ Ideal stops</h3>
        <span class="meta"><span data-i18n="fill">fill</span> <input type="number" id="litres" min="5" max="150" value="40"> L · <span data-i18n="car uses">car uses</span> <input type="number" id="cons" min="2" max="30" step="0.5" value="7"> L/100 km</span></div>

      <div id="ideal"></div>

        <label><input type="checkbox" id="showNA" checked> <span data-i18n="show unavailable">show unavailable</span></label></div>
      <div id="list"></div>
    </div>
  </div>
  <div id="mapSlot"><div id="mapBox"><div id="map"></div>
    <button class="pipbtn" id="pipClose" title="Hide the mini-map" data-i18n-title="Hide the mini-map">✕</button><button class="pipbtn" id="pipBig" title="Back to the full map" data-i18n-title="Back to the full map" data-i18n="⤢ full map">⤢ full map</button></div></div>
  <button class="pipbtn" id="pipShow" data-i18n="🗺 Map">🗺 Map</button>
</div>
<script>

let tollEst = {};
const peageFor = s => exitsToll(s) ? (tollEst[s.id] ?? 1.2) : 0;
function tollTag(s, inSaving) {
  const v = peageFor(s);
  const txt = v < 0 ? t('⚠ leaves toll motorway · avoids tolls: ~{0} € less péage', (-v).toFixed(2))
                    : t('⚠ leaves toll motorway · ~{0} € extra péage (estimated)', v.toFixed(2));
  return `<span class="tag toll">${txt}${inSaving ? t(' (included in saving)') : ''}</span>`;
}
function setMode(m) {
  mode = m === 'near' ? 'near' : 'trip'; store.set('mode', mode);
  document.querySelectorAll('#modeTabs button').forEach(b => b.classList.toggle('on', b.dataset.m === mode));
  $('#tripPanel').style.display = mode === 'trip' ? '' : 'none';
  $('#nearPanel').style.display = mode === 'near' ? '' : 'none';
  document.querySelector('.sortbar [data-s="along"]').textContent = t(mode === 'trip' ? 'Along route' : 'Nearest');
  document.querySelector('.sortbar [data-s="detour"]').style.display = mode === 'trip' ? '' : 'none';
  if (mode === 'near' && sortBy === 'detour') sortBy = 'along';
  document.querySelectorAll('.sortbar button').forEach(x => x.classList.toggle('on', x.dataset.s === sortBy));
}
function setRmode(r) {

// ---------- autocomplete
function setupAuto(key) {
  const inp = $('#' + key), box = inp.closest('.field').querySelector('.sugg');
  let t, items = [], idx = -1;
  const render = () => {
    box.innerHTML = items.map((it, i) => `<div class="${i === idx ? 'on' : ''}" data-i="${i}">${esc(it.label)}</div>`).join('');
    box.style.display = items.length ? 'block' : 'none';
  };
  const pick = i => { chosen[key] = items[i]; inp.value = items[i].label; items = []; render(); };
  inp.addEventListener('input', () => {
    chosen[key] = null; clearTimeout(t);
    const q = inp.value.trim();
    if (q.length < 3) { items = []; return render(); }
    t = setTimeout(async () => {
      try { items = await (await fetch('/api/geocode?q=' + encodeURIComponent(q))).json(); idx = -1; render(); } catch {}
    }, 250);
  });
  inp.addEventListener('keydown', e => {
    if (!items.length) { if (e.key === 'Enter') search(); return; }
    if (e.key === 'ArrowDown') { idx = Math.min(idx + 1, items.length - 1); render(); e.preventDefault(); }
    else if (e.key === 'ArrowUp') { idx = Math.max(idx - 1, 0); render(); e.preventDefault(); }
    else if (e.key === 'Enter') { pick(Math.max(idx, 0)); e.preventDefault(); }
    else if (e.key === 'Escape') { items = []; render(); }
  });
  box.addEventListener('mousedown', e => { const d = e.target.closest('[data-i]'); if (d) { e.preventDefault(); pick(+d.dataset.i); } });
  inp.addEventListener('blur', () => setTimeout(() => { items = []; render(); }, 150));
}
['from', 'via', 'to', 'center'].forEach(setupAuto);

async function resolve(key) {
  if (chosen[key]) return chosen[key];
  const q = $('#' + key).value.trim();
  if (!q) return null;
  const r = await (await fetch('/api/geocode?q=' + encodeURIComponent(q))).json();
  if (!r.length) throw new Error(t('Couldn\'t find "{0}"', q));
  chosen[key] = r[0]; $('#' + key).value = r[0].label;
  return r[0];
}

// ---------- current location
function locate(btn, key) {
  if (!window.isSecureContext || !navigator.geolocation) {
    showMsg(t('Your browser only shares your location with secure (https://) sites. Open the https:// address of this site to use 📍.'), true);
    return;
  }
  btn.textContent = '…';
  navigator.geolocation.getCurrentPosition(async pos => {
    const lon = pos.coords.longitude, lat = pos.coords.latitude;
    let label = t('My location');
    try { const r = await (await fetch(`/api/reverse?lon=${lon}&lat=${lat}`)).json(); if (r) label = t('My location') + ' · ' + r.label; } catch {}
    chosen[key] = {lon, lat, label, me: true}; $('#' + key).value = label; btn.textContent = '📍';
    if (key === 'center' || $('#to').value) search(); else $('#to').focus();
  }, err => {
    btn.textContent = '📍';
    showMsg(t(err.code === 1 ? 'Location permission was refused. Allow location for this site in your browser settings.' : 'Could not get your location, try again outdoors or type your start.'), true);
  }, {enableHighAccuracy: true, timeout: 15000, maximumAge: 60000});
}

// ---------- search
async function search() {
  const btn = $('#go'), my = ++gen;
  btn.disabled = true; btn.textContent = t('Searching…');
  showMsg(`<span class="meta">${t(mode === 'trip' ? 'Planning route and looking up stations…' : rmode === 'drive' ? 'Working out the area reachable by road…' : 'Looking up stations…')}</span>`);
  try {
    if (mode === 'near') {
      const c = await resolve('center');
      if (!c) throw new Error(t('Type an address or tap 📍 to use your location.'));
      const res = await fetch(`/api/nearby?lon=${c.lon.toFixed(5)}&lat=${c.lat.toFixed(5)}&radius=${$('#radius').value}&mode=${rmode}&fuel=${fuel}`);
      const data = await res.json();
      if (data.error) throw new Error(t(data.error));
      if (my !== gen) return;
      clearIdeal();
      lastPts = [c]; lastData = data; trip = data.trip; selId = null;
      stations = data.stations; stations.forEach(s => { if (s.drive !== undefined) s.detour = s.drive; });
      store.set('lastNear', {center: c.me ? null : c, radius: $('#radius').value});
      drawRoute(); drawMarkers(); renderAll(); updatePip();
      fetchDetours(my);
      return;
    }
    const from = await resolve('from'), to = await resolve('to'), via = await resolve('via');
    if (!from || !to) throw new Error(t('Please enter a start and a destination.'));
    const pts = [from, via, to].filter(Boolean);
    const res = await fetch(`/api/route?${pts.map(p => `p=${p.lon.toFixed(5)},${p.lat.toFixed(5)}`).join('&')}&corridor=${$('#corridor').value}&fuel=${fuel}`);
    const data = await res.json();
    if (data.error) throw new Error(t(data.error));
    if (my !== gen) return;
    lastPts = pts; lastData = data; trip = data.trip; selId = null;
    stations = data.stations;
    store.set('last', {from, to, via, corridor: $('#corridor').value});
    clearIdeal();
    drawRoute(); drawMarkers(); renderAll(); updatePip();
    fetchDetours(my);
    fetchIdeal(my);
    fetchTolls(my);
    fetchTraffic(my);
  } catch (e) {
    if (my === gen) showMsg(e.message || t('Something went wrong'), true);
  } finally { if (my === gen) { btn.disabled = false; btn.textContent = t('Find stations'); } }
}

// ---------- station status helpers
function ageDays(iso) { return iso ? (Date.now() - new Date(iso)) / 864e5 : Infinity; }
function ago(iso) {
  const d = ageDays(iso);
  if (d < 1 / 24) return Math.max(1, Math.round(d * 1440)) + ' min';
  if (d < 1) return Math.round(d * 24) + ' h';
  return t(Math.round(d) > 1 ? '{0} days' : '{0} day', Math.round(d));
}
const isOut = s => !!s.out_since && !s.maybe_restocked;
const isAvail = s => !isOut(s) && !s.opposite && s.price != null;
const isFresh = s => ageDays(s.updated) <= 7;
function picks() {
  const av = stations.filter(isAvail);
  const fresh = av.filter(isFresh);
  const cheapest = fresh.length ? fresh.reduce((a, b) => b.price < a.price || (b.price === a.price && (b.detour?.s ?? 1e9) < (a.detour?.s ?? 1e9)) ? b : a) : null;
  const withD = av.filter(s => s.detour);
  const nearest = withD.length ? withD.reduce((a, b) => b.detour.s < a.detour.s || (b.detour.s === a.detour.s && b.price < a.price) ? b : a) : null;
  return {cheapest, nearest, pending: av.filter(s => s.detour === undefined).length, avail: av.length};
}
function detourText(d) {
  if (mode === 'near') {
    if (!d) return d === undefined ? t('by road…') : '';
    return t('{0} min · {1} km by road', Math.max(1, Math.round(d.s / 60)), d.km);
  }
  if (d === undefined) return t('detour…');
  if (d === null) return t('detour ?');
  const m = Math.round(d.s / 60);
  return m < 1 ? t('no detour') : t('+{0} min detour', m);
}

  } else routeLayer = L.polyline(lastData.route.map(c => [c[1], c[0]]), {color: '#2563eb', weight: 5, opacity: .75}).addTo(map);

async function fetchDetours(my) {
  const queue = stations.filter(s => s.detour === undefined && !s.opposite)
    .sort((a, b) => (isAvail(b) - isAvail(a)) || (mode === 'near' ? a.crow_km - b.crow_km : a.off_route_km - b.off_route_km));
  if (mode === 'near') queue.splice(80).forEach(s => s.detour = null);   // road distance only for the 80 nearest
  const byId = Object.fromEntries(stations.map(s => [s.id, s]));
  let redraw = null;
  const worker = async () => {
    while (queue.length && my === gen) {
      const batch = queue.splice(0, 6);
      try {
        const r = await (await fetch(`/api/detours?trip=${encodeURIComponent(trip)}&ids=${batch.map(s => s.id).join(',')}`)).json();
        if (my !== gen || r.error) return;
        for (const [id, d] of Object.entries(r)) if (byId[id]) byId[id].detour = d;

    }

  m.on('click', () => { if (m.stationId) { selId = m.stationId; renderList(); drawMarkers(); } const mk = markerById[m.stationId] || m;
    if (isPip()) mk.openTooltip(); else mk.openPopup();
    document.querySelector(`.st[data-id="${m.stationId}"]`)?.scrollIntoView({block: isPip() ? 'start' : 'nearest', behavior: 'smooth'}); });
}
function showMap() { if (pipClosed) { pipClosed = false; updatePip(); } }
new IntersectionObserver(([e]) => { slotVisible = e.intersectionRatio > 0.25; updatePip(); }, {threshold: [0, 0.25, 0.5, 1]}).observe($('#mapSlot'));
landscape.addEventListener('change', () => { updatePip(); setTimeout(() => map.invalidateSize(), 100); });
$('#pipClose').onclick = e => { e.stopPropagation(); pipClosed = true; updatePip(); };
$('#pipShow').onclick = () => showMap();
$('#pipBig').onclick = e => { e.stopPropagation(); $('#mapSlot').scrollIntoView({behavior: 'smooth', block: 'center'}); };

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c])); }

// ---------- init
applyLang();
$('#langBtn').onclick = () => {
  lang = lang === 'fr' ? 'en' : 'fr'; store.set('lang', lang);
  applyLang(); setMode(mode);
  if (lastData) { renderAll(); drawMarkers(); }
  if (!$('#go').disabled) $('#go').textContent = t('Find stations');
};
setFuel(store.get('fuel') || 'E85');
fetch('/api/status').then(r => r.json()).then(s => {
  if (s.feed_updated) { feedTs = s.feed_updated; applyLang(); }
}).catch(() => {});
setRmode(store.get('rmode') || 'drive');
const fill = store.get('fill'); if (fill) { $('#litres').value = fill.l || 40; $('#cons').value = fill.c || 7; }
setMode(store.get('mode') || 'trip');
const lastNear = store.get('lastNear');
if (lastNear) { if (lastNear.center) { chosen.center = lastNear.center; $('#center').value = lastNear.center.label; } $('#radius').value = lastNear.radius || '10'; }
const last = store.get('last') || store.get('e85-last');
if (last) {
  Object.assign(chosen, {from: last.from, to: last.to, via: last.via});
  $('#from').value = last.from?.label || ''; $('#to').value = last.to?.label || '';
  if (last.via) { $('#via').value = last.via.label; $('#viaWrap').style.display = 'block'; $('#addVia').style.display = 'none'; }
  $('#corridor').value = last.corridor || '3';
}
</script>
